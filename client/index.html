<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://res.cloudinary.com/djw640wo2/image/upload/v1786775418/file_00000000062c81f49d6e06fb9660164e_tflvrq.png"
    />
    <title>Maktabah Huda</title>
  </head>
  <body>
    <script>
      (function () {
        function setReaderHeight() {
          var h =
            (window.visualViewport && window.visualViewport.height) ||
            window.innerHeight ||
            0;
          if (h) {
            document.documentElement.style.setProperty(
              "--reader-height",
              h + "px",
            );
          }
        }
        setReaderHeight();
        window.addEventListener("resize", setReaderHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", setReaderHeight);
          window.visualViewport.addEventListener("scroll", setReaderHeight);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
